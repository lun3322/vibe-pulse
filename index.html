<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横排红绿灯</title>
  <style>
    :root {
      --housing: #171b1c;
      --housing-edge: #2f3536;
      --red: #ff1f2d;
      --yellow: #ffb900;
      --green: #00d664;
      --cycle: 6s;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, #ffffff 0 16rem, transparent 34rem),
        #f0f0ea;
    }

    .traffic-light {
      position: relative;
      display: flex;
      gap: clamp(0.7rem, 2vw, 1.25rem);
      padding: clamp(0.8rem, 2.4vw, 1.3rem);
      border: clamp(0.25rem, 0.7vw, 0.4rem) solid var(--housing-edge);
      border-radius: clamp(1.6rem, 5vw, 2.8rem);
      background: linear-gradient(145deg, #252a2b 0%, var(--housing) 48%, #0b0d0e 100%);
      box-shadow:
        0 1.5rem 2.2rem rgb(27 31 32 / 24%),
        inset 0 0.2rem 0.25rem rgb(255 255 255 / 10%),
        inset 0 -0.25rem 0.35rem rgb(0 0 0 / 45%);
      animation: arrive 700ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .traffic-light::after {
      content: "";
      position: absolute;
      inset: 8% 5% auto;
      height: 18%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgb(255 255 255 / 9%), transparent);
      pointer-events: none;
    }

    .light {
      position: relative;
      width: clamp(4.2rem, 18vw, 7.5rem);
      aspect-ratio: 1;
      overflow: hidden;
      border: clamp(0.22rem, 0.7vw, 0.4rem) solid #080a0a;
      border-radius: 50%;
      background: var(--color);
      filter: saturate(0.58) brightness(0.42);
      box-shadow:
        inset 0 0.7rem 1rem rgb(0 0 0 / 38%),
        inset 0 -0.4rem 0.9rem rgb(255 255 255 / 8%),
        0 0.2rem 0.3rem rgb(255 255 255 / 7%);
      animation: signal var(--cycle) infinite;
    }

    .light::before {
      content: "";
      position: absolute;
      top: 12%;
      left: 18%;
      width: 46%;
      height: 30%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgb(255 255 255 / 55%), rgb(255 255 255 / 5%) 70%);
      transform: rotate(-28deg);
    }

    .red {
      --color: var(--red);
      --glow: 255 31 45;
    }

    .yellow {
      --color: var(--yellow);
      --glow: 255 185 0;
      animation-delay: -4s;
    }

    .green {
      --color: var(--green);
      --glow: 0 214 100;
      animation-delay: -2s;
    }

    @keyframes signal {
      0%, 29% {
        filter: saturate(1.08) brightness(1.08);
        box-shadow:
          inset 0 0.55rem 0.9rem rgb(255 255 255 / 17%),
          inset 0 -0.65rem 1rem rgb(0 0 0 / 22%),
          0 0 1rem rgb(var(--glow) / 70%),
          0 0 2.8rem rgb(var(--glow) / 35%);
      }
      34%, 100% {
        filter: saturate(0.58) brightness(0.42);
        box-shadow:
          inset 0 0.7rem 1rem rgb(0 0 0 / 38%),
          inset 0 -0.4rem 0.9rem rgb(255 255 255 / 8%),
          0 0.2rem 0.3rem rgb(255 255 255 / 7%);
      }
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(1.5rem) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .traffic-light,
      .light {
        animation: none;
      }

      .light {
        filter: saturate(1) brightness(0.9);
      }
    }
  </style>
</head>
<body>
  <div class="traffic-light" role="img" aria-label="横排红黄绿交通信号灯">
    <span class="light red" aria-hidden="true"></span>
    <span class="light yellow" aria-hidden="true"></span>
    <span class="light green" aria-hidden="true"></span>
  </div>
</body>
</html>
